name: Docker Image CI

on:
  workflow_call:
    inputs:
      project_name:
        required: true
        type: string
    secrets:
      DEPLOYMENT_REPO_PAT:
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
    - name: Checkout Main Repo
      uses: actions/checkout@v4

    - name: Checkout K8s Repo
      uses: actions/checkout@v4
      with:
        repository: 'LunatigTV/k8s-deployments'
        path: 'k8s-deployments'
        token: ${{ secrets.DEPLOYMENT_REPO_PAT }}

    - name: Set Short SHA
      id: vars
      run: |
        # Extract short SHA directly from github.sha context
        echo "sha_short=${GITHUB_SHA:~0,7}" >> $GITHUB_OUTPUT

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push Docker image
      run: |
        IMAGE_NAME="ghcr.io/lunatigtv/${{ inputs.project_name }}"
        IMAGE_TAG="${{ steps.vars.outputs.sha_short }}"
        
        docker build . --file Dockerfile --tag ${IMAGE_NAME}:${IMAGE_TAG} --tag ${IMAGE_NAME}:latest
        docker push ${IMAGE_NAME}:${IMAGE_TAG}
        docker push ${IMAGE_NAME}:latest

    - name: Update Deployment Manifest and Push Changes
      run: |
        IMAGE_NAME="ghcr.io/lunatigtv/${{ inputs.project_name }}"
        IMAGE_TAG="${{ steps.vars.outputs.sha_short }}"
        DEPLOYMENT_FILE="k8s-deployments/apps/${{ inputs.project_name }}/deployment.yaml"

        # Update the image tag in deployment.yaml
        sed -i -E "s|image: ${IMAGE_NAME}:.*|image: ${IMAGE_NAME}:${IMAGE_TAG}|g" $DEPLOYMENT_FILE

        # Commit and push back to k8s-deployments
        cd k8s-deployments
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        
        git add apps/${{ inputs.project_name }}/deployment.yaml
        if git diff --staged --quiet; then
          echo "No changes to commit."
        else
          git commit -m "ci(auto-deploy): update ${{ inputs.project_name }} image to ${IMAGE_TAG}"
          git push
        fi
